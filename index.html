<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ayo Bermain!</title>
<style>
:root{--ink:#2b2350;--sky:#8fd8ff;--sun:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:"Baloo 2","Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:800;color:var(--ink);
background:radial-gradient(circle at 12% 8%,#fff 0 40px,transparent 41px),radial-gradient(circle at 88% 16%,#fff 0 30px,transparent 31px),linear-gradient(var(--sky),#c9f0ff 60%,#b6f0b0 60.1%);user-select:none}
header{display:flex;align-items:center;justify-content:center;gap:14px;padding:22px 16px 6px}
#mas{font-size:72px;border:4px solid var(--ink);background:var(--sun);border-radius:50%;width:112px;height:112px;display:grid;place-items:center;box-shadow:0 6px 0 var(--ink);cursor:pointer;animation:bob 2.4s ease-in-out infinite}
#mas:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
h1{font-size:clamp(34px,8vw,60px);margin:0;line-height:1;transform:rotate(-2deg);text-shadow:3px 3px 0 #fff}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;max-width:1000px;margin:18px auto 40px;padding:0 18px}
.g{position:relative;aspect-ratio:1;border:4px solid var(--ink);border-radius:28px;background:var(--c);box-shadow:0 8px 0 var(--ink);display:grid;place-items:center;text-decoration:none;color:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s}
.g:nth-child(odd){transform:rotate(-1.5deg)}.g:nth-child(even){transform:rotate(1.5deg)}
a.g:hover{transform:translateY(-4px) rotate(0)}
a.g:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
a.g:focus-visible{outline:6px solid #fff;outline-offset:4px}
.g span{font-size:clamp(64px,13vw,92px);line-height:1}
.g small{position:absolute;bottom:10px;font-size:15px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:0 10px}
.g.lock{filter:grayscale(.85) brightness(1.05);opacity:.55;box-shadow:0 4px 0 var(--ink)}
.g.lock::after{content:"🔒";position:absolute;top:8px;right:12px;font-size:26px}
.g.no{animation:shake .4s}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes shake{25%{translate:-8px}75%{translate:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header><div id="mas" role="button" aria-label="Sapa">🐥</div><h1>Ayo Bermain!</h1></header>
<main id="m"></main>
<script>
const G=[
["🍎","Hitung Buah","#ff9aa2","01-hitung-buah.html"],
["🔺","Rumah Bentuk","#ffd23f"],
["🐄","Suara Siapa Itu?","#9be7a3"],
["🧸","Rapikan Mainan","#c4b5fd"],
["🌧️","Cuaca & Baju","#8fd8ff"],
["🧹","Alat & Fungsinya","#ffb86b"],
["✏️","Tarik Garis","#f9a8d4"],
["🐾","Jejak Labirin","#a7f3d0"],
["🧩","Puzzle","#fde68a"],
["🔤","Huruf Pertama","#bfdbfe"],
["🧺","Keranjang Warna","#fca5a5","11-keranjang-warna.html"]];
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.85;u.pitch=1.15;const v=speechSynthesis.getVoices().find(v=>/^id/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const m=document.getElementById("m");
G.forEach(([e,n,c,f])=>{
  const d=document.createElement(f?"a":"div");
  d.className="g"+(f?"":" lock");d.style.setProperty("--c",c);
  d.innerHTML=`<span>${e}</span><small>${n}</small>`;
  d.setAttribute("aria-label",n);
  if(f)d.href=f;else d.onclick=()=>{say("Segera hadir ya!");d.classList.remove("no");void d.offsetWidth;d.classList.add("no")};
  m.append(d)});
document.getElementById("mas").onclick=()=>say("Halo teman-teman! Ayo kita bermain!");
</script>
</body>
</html>
