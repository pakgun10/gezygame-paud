<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Keranjang Warna</title>
<style>
:root{--ink:#2b2350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:800;color:var(--ink);background:linear-gradient(#8fd8ff,#d4f4ff 55%,#ffe9a8);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.bar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 4px}
.btn{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);background:#fff;font-size:30px;box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;text-decoration:none;color:inherit;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:5px solid #ff6b6b}
#stars{font-size:34px;letter-spacing:3px;text-shadow:0 3px 0 #fff}
#items{flex:1;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-content:center;padding:8px 14px}
.it{font-size:clamp(54px,13vmin,92px);width:1.45em;height:1.45em;display:grid;place-items:center;background:#fff;border:4px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);cursor:grab;touch-action:none;animation:pop .45s backwards;line-height:1}
.it.sel{outline:7px solid #ffb703}
.it.drag{z-index:9;pointer-events:none;transition:none!important;box-shadow:0 14px 0 #2b235055}
.it.back{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.it.hint{animation:wob .6s infinite}
#baskets{display:flex;gap:12px;padding:20px 12px calc(16px + env(safe-area-inset-bottom,0px));justify-content:center}
.bk{flex:1;max-width:230px;height:clamp(110px,24vh,170px);border:4px solid var(--ink);border-radius:14px 14px 44px 44px;background:var(--c);position:relative;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;padding:8px;box-shadow:0 7px 0 var(--ink);cursor:pointer;transition:transform .2s}
.bk b{position:absolute;top:-26px;left:50%;translate:-50% 0;font-size:30px;background:#fff;border:4px solid var(--ink);border-radius:50%;width:54px;height:54px;display:grid;place-items:center}
.bk i{font-style:normal;font-size:30px;animation:pop .35s}
.bk.glow{animation:glow .6s infinite alternate}
.bk.ok{transform:scale(1.07) rotate(-2deg)}
.bk.no,#items.no{animation:shake .35s}
.ov{position:fixed;inset:0;background:#2b2350cc;display:grid;place-content:center;justify-items:center;gap:22px;z-index:30}
.ov[hidden]{display:none}
#big{font-size:clamp(110px,28vmin,200px);line-height:1;animation:bob 1.6s ease-in-out infinite}
.play{width:140px;height:140px;font-size:64px;background:#ffd23f}
.cf{position:fixed;top:-50px;font-size:34px;pointer-events:none;z-index:40;animation:fall 2.2s linear forwards}
.fb{position:fixed;left:50%;top:42%;translate:-50% -50%;z-index:35;pointer-events:none;display:grid;justify-items:center;font-size:clamp(90px,24vmin,170px);line-height:1;border:5px solid var(--ink);border-radius:36px;padding:10px 28px;box-shadow:0 8px 0 var(--ink);animation:fbp 1.1s both;animation-duration:1.1s!important}
.fb small{font-size:.45em}
.fb.y{background:#b6f0b0}.fb.n{background:#ffd6d6}
@keyframes fbp{0%{scale:0}20%{scale:1.15}35%{scale:1}85%{opacity:1}100%{opacity:0;scale:.9}}
@keyframes pop{from{transform:scale(0)}}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes glow{to{transform:scale(1.08);filter:brightness(1.15)}}
@keyframes wob{25%{rotate:-6deg}75%{rotate:6deg}}
@keyframes shake{25%{translate:-9px}75%{translate:9px}}
@keyframes fall{to{transform:translateY(115vh) rotate(420deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="bar"><a class="btn" href="index.html" aria-label="Beranda">🏠</a><div id="stars" aria-hidden="true">☆☆☆</div><button class="btn" id="rep" aria-label="Ulangi suara">🔊</button></div>
<div id="items"></div>
<div id="baskets"></div>
<div class="ov" id="ov"><div id="big">🧺</div><button class="btn play" id="go" aria-label="Main">▶</button><a class="btn" href="index.html" id="hm" hidden aria-label="Beranda">🏠</a></div>
<script>
const $=s=>document.querySelector(s);
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.85;u.pitch=1.15;const v=speechSynthesis.getVoices().find(v=>/^id/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
let ac;function tone(f,d=.15,t=0){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const ok=()=>[660,880,1100].forEach((f,i)=>tone(f,.15,i*.09)),bad=()=>tone(260,.25);
function conf(){for(let i=0;i<28;i++){const s=document.createElement("span");s.className="cf";s.textContent=["⭐","🎉","🎈","✨","🌟"][i%5];s.style.left=Math.random()*96+"vw";s.style.animationDelay=Math.random()*.6+"s";document.body.append(s);setTimeout(()=>s.remove(),3000)}}

function fb(good){const d=document.createElement("div");d.className="fb "+(good?"y":"n");d.innerHTML=good?"<span>✅</span><small>😊</small>":"<span>❌</span><small>🤔</small>";document.body.append(d);setTimeout(()=>d.remove(),1150)}
const PUJI=["Betul!","Hebat!","Pintar!","Yeay, tepat!"];
const C={
hijau:{c:"#3ddc84",b:"🌿",i:[["🥒","Mentimun"],["🐸","Katak"],["🥦","Brokoli"],["🍏","Apel hijau"],["🐊","Buaya"]]},
merah:{c:"#ff6b6b",b:"❤️",i:[["🍅","Tomat"],["🍎","Apel"],["🍓","Stroberi"],["🌶️","Cabai"],["🦀","Kepiting"]]},
kuning:{c:"#ffd23f",b:"☀️",i:[["🍌","Pisang"],["🌽","Jagung"],["🐥","Anak ayam"],["🍋","Lemon"],["⭐","Bintang"]]},
biru:{c:"#4aa8ff",b:"🌊",i:[["🐳","Paus"],["🫐","Blueberry"],["🧢","Topi"],["🦋","Kupu-kupu"],["🐬","Lumba-lumba"]]}};
const R=[["hijau","merah"],["hijau","merah","kuning"],["hijau","merah","kuning","biru"]];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let rd=0,sel=null,idle,msg="";

function start(){
  const cols=R[rd];
  $("#stars").textContent="⭐".repeat(rd)+"☆".repeat(3-rd);
  $("#baskets").innerHTML=cols.map(k=>`<div class="bk" data-k="${k}" style="--c:${C[k].c}"><b>${C[k].b}</b></div>`).join("");
  const its=shuf(cols.flatMap(k=>shuf(C[k].i).slice(0,2).map(([e,n])=>({e,n,k}))));
  $("#items").innerHTML=its.map((o,i)=>`<div class="it" data-k="${o.k}" data-n="${o.n}" style="animation-delay:${i*.07}s">${o.e}</div>`).join("");
  document.querySelectorAll(".bk").forEach(b=>b.onclick=()=>{if(sel)place(sel,b)});
  msg=rd?"Masukkan barang ke keranjang yang warnanya sama!":`Barang warna ${cols[0]} masuk ke keranjang ${cols[0]}!`;
  say(msg);arm();
}
function arm(){clearTimeout(idle);document.querySelectorAll(".hint,.glow").forEach(e=>e.classList.remove("hint","glow"));idle=setTimeout(()=>{const t=$(".it");if(!t)return;t.classList.add("hint");$(`.bk[data-k=${t.dataset.k}]`).classList.add("glow");say(`Ayo, ${t.dataset.n} masuk ke keranjang ${t.dataset.k}!`)},8000)}
function place(it,bk){
  it.classList.remove("sel","drag");sel=null;
  if(it.dataset.k===bk.dataset.k){
    ok();fb(1);say(`${PUJI[Math.floor(Math.random()*4)]} ${it.dataset.n}, ${it.dataset.k}!`);
    const i=document.createElement("i");i.textContent=it.textContent;bk.append(i);
    bk.classList.add("ok");setTimeout(()=>bk.classList.remove("ok"),400);
    it.remove();
    if(!$(".it")){clearTimeout(idle);rd++;setTimeout(()=>{conf();$("#stars").textContent="⭐".repeat(rd)+"☆".repeat(3-rd);say("Hebat! Semua masuk keranjang!");setTimeout(()=>rd<3?start():finish(),2200)},700)}else arm();
  }else{
    bad();fb(0);bk.classList.remove("no");void bk.offsetWidth;bk.classList.add("no");
    say("Ups, belum tepat. Coba keranjang yang lain ya!");back(it);arm();
  }
}
function back(it){it.classList.remove("drag");it.classList.add("back");it.style.transform="";setTimeout(()=>it.classList.remove("back"),320)}
function finish(){$("#big").textContent="🎉";$("#go").textContent="🔄";$("#hm").hidden=false;$("#ov").hidden=false;rd=0;conf();say("Yeay! Kamu pintar sekali! Main lagi yuk!")}

let cur=null,sx=0,sy=0,mv=false;
$("#items").addEventListener("pointerdown",e=>{const t=e.target.closest(".it");if(!t)return;cur=t;sx=e.clientX;sy=e.clientY;mv=false;arm()});
addEventListener("pointermove",e=>{if(!cur)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!mv&&Math.hypot(dx,dy)<10)return;mv=true;cur.classList.add("drag");cur.style.transform=`translate(${dx}px,${dy}px) scale(1.15) rotate(-5deg)`});
addEventListener("pointerup",e=>{
  if(!cur)return;const it=cur;cur=null;
  if(!mv){const was=it.classList.contains("sel");document.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));sel=was?null:it;if(!was)it.classList.add("sel");return}
  const bk=[...document.querySelectorAll(".bk")].find(b=>{const r=b.getBoundingClientRect();return e.clientX>r.left-18&&e.clientX<r.right+18&&e.clientY>r.top-30&&e.clientY<r.bottom+18});
  bk?place(it,bk):back(it);
});
addEventListener("pointercancel",()=>{if(cur){back(cur);cur=null}});
$("#rep").onclick=()=>say(msg);
$("#go").onclick=()=>{$("#ov").hidden=true;ok();start()};
</script>
</body>
</html>
