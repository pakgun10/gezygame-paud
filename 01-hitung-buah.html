<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hitung Buah</title>
<style>
:root{--ink:#2b2350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:800;color:var(--ink);background:linear-gradient(#8fd8ff,#d4f4ff 62%,#b6f0b0 62.1%);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 4px}
.btn{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);background:#fff;font-size:30px;box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;text-decoration:none;color:inherit;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:5px solid #ff6b6b}
#stars{font-size:30px;letter-spacing:3px;text-shadow:0 3px 0 #fff}
#tree{flex:1;margin:6px auto 0;width:min(94vw,640px);display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:center;padding:18px;background:#4cd47a;border:4px solid var(--ink);border-radius:46% 46% 40% 40%/34% 34% 26% 26%;box-shadow:0 8px 0 var(--ink)}
.fr{font-size:clamp(48px,12vmin,86px);line-height:1;width:1.35em;height:1.35em;display:grid;place-items:center;background:#ffffff55;border:3px dashed #fff;border-radius:50%;cursor:pointer;position:relative;animation:pop .4s backwards;font-family:inherit;padding:0}
.fr:focus-visible{outline:5px solid #ffd23f}
.fr:active{transform:scale(.9)}
.fr.c{background:#fff;border-style:solid;border-color:var(--ink);cursor:default}
.fr.c span{opacity:.25;filter:grayscale(.6)}
.fr.c::after{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;font-size:.7em;color:var(--ink);animation:pop .3s}
#bk{height:88px;margin:14px auto 0;width:min(70vw,360px);display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px;font-size:26px;border:4px solid var(--ink);border-radius:10px 10px 36px 36px;background:#ffb86b;padding:6px 10px;box-shadow:0 6px 0 var(--ink);overflow:hidden}
#ch{display:flex;gap:14px;justify-content:center;padding:18px 12px calc(18px + env(safe-area-inset-bottom,0px));min-height:150px}
.ch{flex:1;max-width:170px;border:4px solid var(--ink);border-radius:26px;background:#fff;box-shadow:0 7px 0 var(--ink);cursor:pointer;font-family:inherit;color:var(--ink);display:grid;place-items:center;padding:8px;animation:pop .4s backwards}
.ch:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.ch:focus-visible{outline:5px solid #ff6b6b}
.ch b{font-size:clamp(56px,13vmin,84px);line-height:1}
.ch em{font-style:normal;font-size:14px;color:#ff6b6b;letter-spacing:1px;min-height:18px;word-break:break-all}
.ch.no{animation:shake .35s}
.ch.glow{animation:glow .6s infinite alternate}
.ch.ok{background:#b6f0b0}
.ov{position:fixed;inset:0;background:#2b2350cc;display:grid;place-content:center;justify-items:center;gap:22px;z-index:30}
.ov[hidden]{display:none}
#big{font-size:clamp(110px,28vmin,200px);line-height:1;animation:bob 1.6s ease-in-out infinite}
.play{width:140px;height:140px;font-size:64px;background:#ffd23f}
.cf{position:fixed;top:-50px;font-size:34px;pointer-events:none;z-index:40;animation:fall 2.2s linear forwards}
.fb{position:fixed;left:50%;top:42%;translate:-50% -50%;z-index:35;pointer-events:none;display:grid;justify-items:center;font-size:clamp(90px,24vmin,170px);line-height:1;border:5px solid var(--ink);border-radius:36px;padding:10px 28px;box-shadow:0 8px 0 var(--ink);animation:fbp 1.1s both;animation-duration:1.1s!important}
.fb small{font-size:.45em}
.fb.y{background:#b6f0b0}.fb.n{background:#ffd6d6}
@keyframes fbp{0%{scale:0}20%{scale:1.15}35%{scale:1}85%{opacity:1}100%{opacity:0;scale:.9}}
@keyframes pop{from{transform:scale(0)}}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes glow{to{transform:scale(1.08);filter:brightness(1.12)}}
@keyframes shake{25%{translate:-9px}75%{translate:9px}}
@keyframes fall{to{transform:translateY(115vh) rotate(420deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="bar"><a class="btn" href="index.html" aria-label="Beranda">🏠</a><div id="stars" aria-hidden="true">☆☆☆☆☆</div><button class="btn" id="rep" aria-label="Ulangi suara">🔊</button></div>
<div id="tree"></div>
<div id="bk" aria-hidden="true"></div>
<div id="ch"></div>
<div class="ov" id="ov"><div id="big">🍎</div><button class="btn play" id="go" aria-label="Main">▶</button><a class="btn" href="index.html" id="hm" hidden aria-label="Beranda">🏠</a></div>
<script>
const $=s=>document.querySelector(s);
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="id-ID";u.rate=.85;u.pitch=1.15;const v=speechSynthesis.getVoices().find(v=>/^id/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
let ac;function tone(f,d=.15,t=0){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const ok=()=>[660,880,1100].forEach((f,i)=>tone(f,.15,i*.09)),bad=()=>tone(260,.25),pip=n=>tone(440+n*50,.12);
function conf(){for(let i=0;i<28;i++){const s=document.createElement("span");s.className="cf";s.textContent=["⭐","🎉","🎈","✨","🌟"][i%5];s.style.left=Math.random()*96+"vw";s.style.animationDelay=Math.random()*.6+"s";document.body.append(s);setTimeout(()=>s.remove(),3000)}}

function fb(good){const d=document.createElement("div");d.className="fb "+(good?"y":"n");d.innerHTML=good?"<span>✅</span><small>😊</small>":"<span>❌</span><small>🤔</small>";document.body.append(d);setTimeout(()=>d.remove(),1150)}
const PUJI=["Betul!","Hebat!","Pintar!","Yeay, tepat!"];
const NUM=["nol","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh"];
const F=[["🍎","apel"],["🍌","pisang"],["🍊","jeruk"],["🍓","stroberi"],["🍉","semangka"]];
const MAX=[3,4,5,7,10];
let r=0,n=0,cnt=0,fe="",fn="",wrong=0,msg="",idle;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const stars=()=>$("#stars").textContent="⭐".repeat(r)+"☆".repeat(5-r);

function round(){
  stars();wrong=0;cnt=0;
  [fe,fn]=F[rnd(0,F.length-1)];
  n=rnd(r?2:1,MAX[r]);
  $("#tree").innerHTML=Array.from({length:n},(_,i)=>`<button class="fr" style="animation-delay:${i*.06}s" aria-label="${fn}">${fe}</button>`).join("");
  $("#bk").innerHTML="";$("#ch").innerHTML="";
  document.querySelectorAll(".fr").forEach(b=>b.onclick=()=>tap(b));
  msg=`Ada berapa ${fn} di pohon? Ayo kita hitung bersama!`;say(msg);
}
function tap(b){
  if(b.classList.contains("c"))return;
  cnt++;b.classList.add("c");b.dataset.n=cnt;b.firstChild&&(b.innerHTML=`<span>${fe}</span>`);
  const i=document.createElement("span");i.textContent=fe;$("#bk").append(i);
  pip(cnt);say(NUM[cnt]);
  if(cnt===n)setTimeout(choices,1100);
}
function choices(){
  const pool=new Set([n]),hi=Math.min(10,Math.max(n+2,4)),want=r?3:2;
  while(pool.size<want)pool.add(rnd(Math.max(1,n-2),hi));
  $("#ch").innerHTML=[...pool].sort(()=>Math.random()-.5).map((v,i)=>`<button class="ch" data-v="${v}" style="animation-delay:${i*.1}s" aria-label="${NUM[v]}"><b>${v}</b><em>${"●".repeat(v)}</em></button>`).join("");
  document.querySelectorAll(".ch").forEach(b=>b.onclick=()=>pick(b));
  msg=`Ada berapa ${fn} semuanya? Pilih angkanya!`;say(msg);
}
function pick(b){
  if(+b.dataset.v===n){
    ok();fb(1);b.classList.add("ok");conf();r++;stars();
    document.querySelectorAll(".ch").forEach(x=>x.disabled=true);
    say(`${PUJI[Math.floor(Math.random()*4)]} ${NUM[n]} ${fn}!`);
    setTimeout(()=>r>=5?finish():round(),2400);
  }else{
    bad();fb(0);wrong++;b.classList.remove("no");void b.offsetWidth;b.classList.add("no");
    say("Ups, belum tepat. Coba hitung lagi ya!");
    if(wrong>=2)document.querySelector(`.ch[data-v="${n}"]`).classList.add("glow");
  }
}
function finish(){$("#big").textContent="🎉";$("#go").textContent="🔄";$("#hm").hidden=false;$("#ov").hidden=false;r=0;conf();say("Hebat! Kamu pintar berhitung! Main lagi yuk!")}
$("#rep").onclick=()=>say(msg);
$("#go").onclick=()=>{$("#ov").hidden=true;ok();round()};
</script>
</body>
</html>
